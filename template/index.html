<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aula</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style>
        body {

            background: linear-gradient(135deg, #4a68ff, #7da2ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .prof-btn {
            position: absolute;
            top: 15px;
            left: 15px;
            background: #333;
            color: white;
            padding: 10px 15px;
            border-radius: 16px;
            text-decoration: none;
            font-size: 14px;
        }

        h2 {
            text-align: center;
            margin-bottom: 16px;
        }
        
         label {
            font-weight: bold;
            font-size: 18px;
         }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
        }

        .login-container h2 {
            margin-bottom: 16px;
            color: #333;
        }

        .login-container input {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 14px;
        }

        .login-container button {
            width: 100%;
            padding: 12px;
            background: #4764ff;
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 17px;
            cursor: pointer;
        }

        
    </style>
</head>
<body>
    <a href="login.html" class="prof-btn">Login de Professor</a>

    <div class="login-container">
        <h2>Entrar na Aula</h2>
            <label for="nome">Nome de Usuário:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="codigo">Codigo da Aula:</label>
            <input type="codigo" id="codigo" name="codigo" required>
        <button onclick="window.location.href='./presentation_student.html'">Entrar</button>
    </div>

</body>
</html>
