<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevRápido</title>
    <link rel="stylesheet" href="../static/css/style.css">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">


    <style>
        body{
            background: linear-gradient(135deg, #4a68ff, #7da2ff);
            min-height: 100vh;
        }

        header, .container-principal, .resetar-senha {
             margin: 10px auto;
             border-radius: 4px;
             padding: 20px;
        }

        .cabecalho{
            background-color: transparent;
            width: 80vw;
            align-items: center;
            list-style: none;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            height: 100px;
        }
        ul {
            list-style-type: none;
        }

        .logo{
            width: 90px;
            border-radius: 90px;
        }
        
        .container-principal{
            background-color: #fff;
            width: 30vw;
            height: 350px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            border-radius: 20px;
        }

        .email label,
        .email input,
        .submit button {
            display: block;
            width: 100%;
            box-sizing: border-box;
        }
        
        .email label {
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        .email input {
            padding: 10px;
            margin-bottom: 15px;
            
            border-radius: 25px;
            border: 1px solid #ccc;
        }
        
        .submit button {
            padding: 10px;
            background-color: #4764ff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 25px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <header class="cabecalho">

        <ul><li><h1><a href=""><img src="../static/assets/logo.png" alt="logo temporaria do site" class="logo"></a>DevRápido</h1></li></ul>
    </header>
    <div class="container-principal">
        <div class="resetar-senha">
            
            <h2>Recuperar Senha</h2>

            <form action="" method="post">
                <div class="email">
                    <label for="email-input">E-mail:</label>
                    <input type="email" id="email-input" name="email" required placeholder="Digite seu e-mail aqui...">
                </div>

                <div class="submit">
                    <button type="submit">Enviar</button>
                </div>
            </form>
            
            <p><a href="./login.html">Voltar ao Login</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
