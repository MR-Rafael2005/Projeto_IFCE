<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevRápido</title>
    <link rel="icon" type="image/png" href="../static/assets/vetor_professor.jpg.jpg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #4a68ff, #7da2ff);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
        }

        .login-card {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        form input[type="email"],
        form input[type="senha"] {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 25px;
            outline: none;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .remember {
            display: flex;
            align-items: center;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 25px;
            border: none;
            font-size: 16px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .login-btn {
            background: #4764ff;
            color: white;
        }

        .links {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .links a {
            color: #4764ff;
            font-size: 14px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="image-side">
            <img src="../static/assets/vetor_professor.png.png" alt="Imagem da Tela de Login">
    </div>

    <div class="container">
        <div class="login-card">

            <h2>Seja Bem-vindo!</h2>

            <form id="loginForm">
                <input type="email" placeholder="Insira o endereço de e-mail..." id="email" required>
                <input type="senha" placeholder="senha" id="senha" required>

                <button type="submit" id="login-btn" class="btn login-btn">Login</button>

                <div class="links">
                    <a href="#">Esqueceu sua senha?</a>
                    <a href="#">Criar uma Conta!</a>
                </div>
            </form>

        </div>
    </div>

    <script defer src="../static/js/login.js"></script>
</body>
</html>
