<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevRapido</title>
    <link rel="stylesheet" href="style.css" />
    
    <!-- Versaõ diferente de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="../static/css/style.css" rel="stylesheet">
    
    <style>
        
        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 5px 20px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            }
    

        h2 {
            text-align: center;
            margin-bottom: 16px;
        }

        label {
            font-weight: bold;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 25px;
            font-size: 14px;
        }

        .toggle-btn {
            cursor: pointer;
            font-size: 12px; 
            margin-top: -8px;
            display: block;
            text-align: right;
            color: #0077cc;
        }

        button {
            width: 100%;
            background: #4764ff;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 18px; 
        }
    </style>
</head>

<body class="bright-blue-bg">

    <div class="container">
        <h2>Cadastro de Professor</h2>

        <form id="form">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" minlength="3" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" minlength="8" required>
            <span class="toggle-btn" onclick="showPass('senha')">Mostrar senha</span>

            <label for="confirmar">Confirmar senha:</label>
            <input type="password" id="confirmar" name="confirmar" required>
            <span class="toggle-btn" onclick="showPass('confirmar')">Mostrar senha</span>

            <div id="erroConfirmacao" class="alert alert-danger" style="display:none;"></div>

            <button type="submit" class="m-1 p-2">Cadastrar</button>
        </form>
        
        <p><a href="./login.html">Voltar ao Login</a></p>
    </div>

    <script src="../static/js/login.js"></script>
</body>
</html>
