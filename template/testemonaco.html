<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monaco Editor Exemplo</title>
    <style>
        #editor {
            width: 800px;
            height: 400px;
            border: 1px solid #ccc;
        }
        .controls {
            margin: 10px 0;
        }
        button {
            margin: 5px;
            padding: 8px 16px;
        }
    </style>
</head>
<body>
    <h1>Editor de Código com Monaco</h1>
    
    <div class="controls">
        <label>Linguagem: </label>
        <select id="languageSelect">
            <option value="javascript">JavaScript</option>
            <option value="python">Python</option>
            <option value="html">HTML</option>
            <option value="css">CSS</option>
        </select>
        
        <button onclick="executeCode()">▶️ Executar</button>
        <button onclick="clearEditor()">🧹 Limpar</button>
        <button onclick="downloadCode()">💾 Baixar</button>
    </div>

    <div id="editor"></div>
    
    <div class="controls">
        <h3>Saída:</h3>
        <pre id="output" style="background: #f0f0f0; padding: 10px; min-height: 100px;"></pre>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs/loader.min.js"></script>

    <script>
    require.config({ 
        paths: { 
            'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.45.0/min/vs' 
        }
    });

    // Inicializar editor quando carregado
        require(['vs/editor/editor.main'], function () {
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: `// Bem-vindo ao Monaco Editor!

function saudacao(nome) {
    return "Olá, " + nome + "!";
}

console.log(saudacao("Monaco"));`,
                language: 'python',
                theme: 'vs-dark',
                automaticLayout: true,
                fontSize: 14,
                minimap: { enabled: false },
                scrollBeyondLastLine: false,
                roundedSelection: false,
                readOnly: false,
                cursorStyle: 'line'
            });
        });

    </script>

</body>
</html>
