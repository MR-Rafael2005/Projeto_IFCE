<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevRápido</title>
    <link rel="icon" type="image/png" href="vetor_professor.jpg.jpg">
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div class="image-side">
            <img src="vetor_professor.png.png" alt="Imagem da Tela de Login">
    </div>

    <div class="container">
        <div class="login-card">

            <h2>Seja Bem-vindo!</h2>

            <form id="loginForm">
                <input type="email" placeholder="Insira o endereço de e-mail..." id="email" required>
                <input type="senha" placeholder="senha" id="senha" required>

                <button type="submit" class="btn login-btn">Login</button>

                <div class="links">
                    <a href="#">Esqueceu sua senha?</a>
                    <a href="#">Criar uma Conta!</a>
                </div>
            </form>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
